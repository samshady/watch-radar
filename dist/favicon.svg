<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#eed49f" />
      <stop offset="50%" stop-color="#f5e0b8" />
      <stop offset="100%" stop-color="#c6a052" />
    </linearGradient>
    <filter id="lumeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="64" height="64" rx="18" fill="#11111b" stroke="url(#goldGrad)" stroke-width="2" />

  <!-- Watch Lugs (Top and Bottom) -->
  <path d="M22 10 L22 18 M42 10 L42 18 M22 54 L22 46 M42 54 L42 46" stroke="#eed49f" stroke-width="3" stroke-linecap="round" opacity="0.7" />

  <!-- Crown at 3 o'clock -->
  <rect x="52" y="29" width="4" height="6" rx="1.5" fill="#eed49f" />

  <!-- Outer Bezel -->
  <circle cx="32" cy="32" r="20" stroke="url(#goldGrad)" stroke-width="2.5" fill="#181825" />

  <!-- Inner Chapter Ring -->
  <circle cx="32" cy="32" r="16.5" stroke="#313244" stroke-width="1" />

  <!-- 12, 3, 6, 9 Luminous Hour Markers -->
  <rect x="30.75" y="17.5" width="2.5" height="4.5" rx="1" fill="#00e5ff" filter="url(#lumeGlow)" />
  <rect x="42" y="30.75" width="4.5" height="2.5" rx="1" fill="#00e5ff" />
  <rect x="30.75" y="42" width="2.5" height="4.5" rx="1" fill="#00e5ff" />
  <rect x="17.5" y="30.75" width="4.5" height="2.5" rx="1" fill="#00e5ff" />

  <!-- Watch Hands set to 10:10 -->
  <!-- Hour hand -->
  <line x1="32" y1="32" x2="23" y2="23" stroke="#eed49f" stroke-width="2.2" stroke-linecap="round" />
  <!-- Minute hand -->
  <line x1="32" y1="32" x2="43" y2="21" stroke="#eed49f" stroke-width="1.8" stroke-linecap="round" />
  <!-- Sweeping Seconds Hand (Cyan needle) -->
  <line x1="32" y1="34" x2="32" y2="18" stroke="#00e5ff" stroke-width="1" stroke-linecap="round" filter="url(#lumeGlow)" />
  <circle cx="32" cy="20" r="1.5" fill="#00e5ff" />

  <!-- Center Pin Cap -->
  <circle cx="32" cy="32" r="2.2" fill="#eed49f" stroke="#11111b" stroke-width="0.8" />
</svg>
